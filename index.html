<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Koran-Begleiter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Koran-Begleiter">
<meta name="theme-color" content="#0B1024">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Scheherazade New";src:url("ScheherazadeNew-Regular.woff2") format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:"Gentium Book Plus";src:url("GentiumBookPlus-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
:root{
  --bg:#FAEEDA; --ink:#412402; --ink2:#854F0B; --accent:#D85A30; --accent-d:#993C1D;
  --card:#fff; --fs:2.4rem;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 40px}
.ar{font-family:"Scheherazade New",serif;direction:rtl}
/* Kopf */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.round{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.35rem;flex:none}
.title{text-align:center;min-width:0}
.title .ar{font-size:2rem;line-height:1.35}
.title .lat{font-weight:800;color:var(--ink2);font-size:.95rem}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;white-space:nowrap}
/* Startseite */
.hello{font-weight:900;font-size:1.6rem;margin:6px 4px 2px}
.hello-sub{color:var(--ink2);font-weight:700;margin:0 4px 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stile{border-radius:22px;padding:12px 14px 12px;text-align:right;position:relative;min-height:118px;display:flex;flex-direction:column;justify-content:space-between}
.stile:active,.vt:active,.big:active,.chip:active{transform:scale(.96)}
.stile .no{position:absolute;left:12px;top:12px;font-weight:900;font-size:.95rem;opacity:.75}
.stile .ar{font-size:2.1rem;line-height:1.4}
.stile .lat{font-weight:800;text-align:left;font-size:.95rem}
.stile .meta{display:flex;justify-content:space-between;font-weight:800;font-size:.85rem;opacity:.85;direction:ltr}
.stile.done{outline:4px solid var(--accent)}
/* Farben */
.c0{background:#9FE1CB;color:#04342C}.c1{background:#F5C4B3;color:#4A1B0C}.c2{background:#CECBF6;color:#26215C}
.c3{background:#B5D4F4;color:#042C53}.c4{background:#F4C0D1;color:#4B1528}.c5{background:#C0DD97;color:#173404}
/* Verskacheln */
.vtiles{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px;direction:rtl}
.vt[hidden]{display:none!important}
.tbar{display:flex;align-items:center;justify-content:center;gap:14px;margin:2px 0 8px}
.tbar .pg{font-weight:900;color:var(--ink2);min-width:70px;text-align:center}
.vt{min-width:52px;height:52px;border-radius:14px;font-weight:900;font-size:1.15rem;display:flex;align-items:center;justify-content:center;gap:3px;padding:0 8px;direction:ltr;border:3px solid transparent}
.vt.cur{border-color:var(--accent)}
.many2 .vt{min-width:36px;height:36px;font-size:.8rem}
.sect{font-weight:900;color:var(--ink2);margin:18px 6px 8px;font-size:1rem}
.pkt{font-size:.72rem;font-weight:800;color:#9a5b00;background:#FFF1D6;border-radius:999px;padding:2px 8px;white-space:nowrap;vertical-align:middle}
.hint a{color:var(--accent-d)}
.pkbox{background:#fff;border-radius:22px;padding:14px 16px;margin-top:14px;text-align:center}
.pkh{font-weight:900;color:var(--ink2);cursor:pointer;user-select:none;padding:2px 0}
.pkh .ar{display:inline-block;transition:transform .2s;margin-left:4px}.pkbox.open .pkh .ar{transform:rotate(90deg)}
.pkbody{display:none;margin-top:8px}.pkbox.open .pkbody{display:block}
.pkst{font-size:.85rem;font-weight:800;color:var(--ink2);margin:10px 0 6px}
.pkdl{display:inline-block;margin:0;background:#FAEEDA;color:var(--ink2);font-weight:900;border-radius:999px;padding:8px 14px;text-decoration:none;font-size:.92rem}
.pkbtn{display:block;margin:4px auto 0;background:#FAEEDA;color:var(--ink2);font-weight:900;border-radius:999px;padding:10px 18px;font-size:.95rem}
.pkmsg{text-align:center;font-size:.85rem;font-weight:700;color:var(--ink2);margin-top:6px;min-height:1em}
.many{gap:6px}.many .vt{min-width:42px;height:42px;font-size:.95rem;border-radius:12px;padding:0 5px;border-width:2px}
.vt.inr{box-shadow:0 0 0 3px #fff inset}
.vt{position:relative}
.vt .ok{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#1D9E75;color:#fff;font-size:.7rem;display:none;align-items:center;justify-content:center;border:2px solid #fff}
.vt .ok.on{display:flex}
.many .vt .ok{width:17px;height:17px;top:-5px;right:-5px;font-size:.6rem}
/* Verskarte */
.card{background:var(--card);border-radius:26px;padding:18px 16px 14px;border:4px solid var(--accent);position:relative}
.card .verse{font-size:var(--fs);line-height:2.15;text-align:center;min-height:2.2em}
.card .verse.rng{max-height:58vh;overflow-y:auto;position:relative;overscroll-behavior:contain}
.rv{padding:.1em .25em;margin:.12em 0;border-radius:14px;cursor:pointer;transition:opacity .2s,background .2s}
.rv.cur{background:rgba(216,90,48,.07)}
.night .rv.cur{background:rgba(242,193,78,.08)}
.verse.rng.playing .rv:not(.cur){opacity:.3}
.w{padding:0 .12em;border-radius:12px;transition:background .12s,color .12s}
.w.on{background:var(--accent);color:#fff}
.w.done{color:#b07a52}
.card .verse.lat{font-family:"Gentium Book Plus",Georgia,serif;font-size:calc(var(--fs)*.52);line-height:1.75;direction:ltr;text-align:left;padding:.2em .1em}
.card .verse.lat .w{padding:0 .03em;border-radius:8px}
.card .verse.trl .w{white-space:nowrap}
.card .verse.lat .vno{font-family:"Gentium Book Plus",Georgia,serif;font-size:.8em;color:var(--ink2)}
.vno{color:var(--accent);white-space:nowrap}
.hide .verse .w,.hide .verse .vno{filter:blur(12px)}
.hide .card.peek .verse .w,.hide .card.peek .verse .vno{filter:none}
.card .cap{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:8px}
.tag{font-weight:900;font-size:.85rem;color:var(--ink2)}
.know{width:58px;height:58px;border-radius:50%;background:#fff;border:4px solid #D3D1C7;color:#D3D1C7;font-size:1.8rem;font-weight:900;display:grid;place-items:center;line-height:1;transition:background .15s,border-color .15s,color .15s}
.know.on{background:#1D9E75;border-color:#1D9E75;color:#fff}
.know.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.25)}100%{transform:scale(1)}}
.allbtn{display:flex;justify-content:flex-end;margin:-4px 0 12px}
.allbtn button{background:#fff;border-radius:999px;padding:8px 14px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:8px}
.allbtn button .ck{width:24px;height:24px;border-radius:50%;border:3px solid #D3D1C7;color:transparent;display:grid;place-items:center;font-size:.8rem}
.allbtn button.on .ck{background:#1D9E75;border-color:#1D9E75;color:#fff}
/* Startseite Liste */
.mq{background:#fff;border-radius:22px;padding:10px 10px 6px;margin:10px 0 4px}
.mq svg{display:block;width:100%;height:auto}
.mq .mqt{text-align:center;font-weight:900;font-size:min(1.02rem,4.1vw);white-space:nowrap;color:var(--ink);margin:2px 6px 8px;line-height:1.35}
.mq .df{fill:#FFFAF0}.night .mq .df{fill:#1C2548}
.mq .ed{fill:none;stroke:#B08A3E;stroke-width:5;stroke-dasharray:18 12;stroke-linecap:round}.night .mq .ed{stroke:#E8C77A}
.mq .nm{fill:#9A7A3A;font-family:inherit;font-weight:900}.night .mq .nm{fill:#E8C77A}
.mq .dr{cursor:pointer}
.mqw{position:relative}
.mq .rev{transform:scale(1.18);transition:transform 2.2s cubic-bezier(.2,.7,.2,1) .35s}
.mq .rvd{fill:#2A1E10;opacity:.85;transition:opacity 1.8s ease .3s}
.mq .rvg.open .rev{transform:scale(1)}.mq .rvg.open .rvd{opacity:0}.mqo{position:absolute;inset:0}
.mq .dw{position:absolute;perspective:700px;cursor:pointer;z-index:1}
.mq .leaf{position:absolute;inset:0;transform-origin:0 50%;transform-style:preserve-3d;animation:mqwig 1.6s ease-in-out infinite}
.mq .fr,.mq .bk{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mq .fr{background:#FFFAF0;outline:2px dashed #B08A3E;outline-offset:-2px;display:flex;align-items:center;justify-content:center;color:#9A7A3A;font-weight:900;box-shadow:0 0 0 0 rgba(242,193,78,.0);animation:mqpulse 1.6s ease-in-out infinite}
.mq .kn{position:absolute;right:7%;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#B08A3E}
.mq .bk{background:linear-gradient(90deg,#B8A07A,#D9C7A3);transform:rotateY(180deg)}
.night .mq .fr{background:#1C2548;outline-color:#E8C77A;color:#E8C77A}.night .mq .kn{background:#E8C77A}.night .mq .bk{background:linear-gradient(90deg,#0B1024,#2A3460)}
.mq .glow{position:absolute;inset:-25%;background:radial-gradient(closest-side,rgba(255,214,110,.95),rgba(255,214,110,0));opacity:0;pointer-events:none}
.mq .sp{position:absolute;color:#F2C14E;font-size:16px;opacity:0;pointer-events:none;text-shadow:0 0 6px #fff3c4}
.mq .s1{left:20%;top:20%}.mq .s2{left:75%;top:30%}.mq .s3{left:40%;top:75%}.mq .s4{left:85%;top:80%}
@keyframes mqwig{0%,100%{transform:rotateY(0)}50%{transform:rotateY(-14deg)}}
@keyframes mqpulse{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,0)}50%{box-shadow:0 0 14px 4px rgba(242,193,78,.85)}}
.mq .dw.open{z-index:3}
.mq .dw.open .leaf{animation:mqopen 1.5s cubic-bezier(.3,.1,.3,1) both}
.mq .dw.open .fr{animation:none}
.mq .dw.open .glow{animation:mqglow 1.8s ease-out both}
.mq .dw.open .sp{animation:mqsp 1.6s ease-out both}.mq .dw.open .s2{animation-delay:.15s}.mq .dw.open .s3{animation-delay:.3s}.mq .dw.open .s4{animation-delay:.45s}
@keyframes mqopen{0%{transform:rotateY(0)}70%{transform:rotateY(-118deg)}85%{transform:rotateY(-104deg)}100%{transform:rotateY(-110deg)}}
@keyframes mqglow{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}
@keyframes mqsp{0%{opacity:0;transform:scale(.3)}40%{opacity:1;transform:scale(1.4) translateY(-6px)}100%{opacity:0;transform:scale(.6) translateY(-18px)}}
@media (prefers-reduced-motion:reduce){.mq .leaf,.mq .fr{animation:none!important}}
.mq .dfe{fill:none;stroke:#B08A3E;stroke-width:5;stroke-dasharray:18 12}.night .mq .dfe{stroke:#E8C77A}
.mq .knob{fill:#B08A3E}.night .mq .knob{fill:#E8C77A}

.mq .cap{text-align:center;font-weight:900;font-size:1.08rem;color:var(--ink2);margin-top:6px}
@keyframes mqin{0%{opacity:0}100%{opacity:1}}
.mq .new{animation:mqin 1.6s ease 0.4s both}

:root{color-scheme:light}
html.night{color-scheme:dark;--bg:#0B1024;--ink:#F3E9D2;--ink2:#C9C0DA;--accent:#F2C14E;--accent-d:#F2C14E;--card:#161E3C}
html.night body{background:#0B1024 url("sterne.svg") repeat}
.night .round,.night .pill,.night .chip,.night .mid,.night .setbtn,.night .allbtn button,.night .dots i{background:#1A2244}
.night .list,.night .settings,.night .pkbox,.night .mq,.night .welcome{background:#161E3C}
.night .row{border-bottom-color:#2A3360}.night .row .bar{background:#2A3360}
.night .settings .chip,.night .pkdl,.night .pkbtn{background:#222B4E}
.night .chip.on,.night .w.on,.night .cont,.night .big,.night .say,.night .go{color:#0B1024}
.night .w.done{color:#8F8AA8}
.night .cont .pl{background:#0B1024;color:#F2C14E}
.night .know,.night .sck{background:#1A2244;border-color:#4A5486;color:#4A5486}
.night .sck:not(.on){color:transparent}
.night .allbtn button .ck{border-color:#4A5486}
.night .know.on,.night .sck.on,.night .allbtn button.on .ck{background:#7FD6C2;border-color:#7FD6C2;color:#0B1024}
.night .row.done .bar i{background:#7FD6C2}
.night .vt .ok{background:#7FD6C2;color:#0B1024;border-color:#0B1024}
.night .vt.inr{box-shadow:0 0 0 3px #F2C14E inset}
.night select,.night input{background:#1A2244;border-color:#3A4370;color:var(--ink)}
.night .pkt{background:#3A3420;color:#F2C14E}
.night .toast{background:#7FD6C2;color:#0B1024}
.night .err{color:#F09595}
.night .mq .base{opacity:.3}
.night .c0{background:#264A4A;color:#CFF3EA}.night .c1{background:#4A3226;color:#F8D3C4}.night .c2{background:#3A3360;color:#E9E3FF}
.night .c3{background:#253D5E;color:#D7E8FA}.night .c4{background:#4A2E44;color:#FAD9E8}.night .c5{background:#33421F;color:#DDEDC3}

.vsw{display:flex;gap:6px;justify-content:center;margin:0 0 10px}
.vsw button{background:var(--card);border-radius:999px;padding:7px 14px;font-weight:900;color:var(--ink2);font-size:.92rem}
.vsw button.on{background:var(--accent);color:#fff}
.night .vsw button{background:#1A2244}.night .vsw button.on{background:var(--accent);color:#0B1024}
.mus{display:none}
.mview .mus{display:block}.mview #card,.mview .allbtn{display:none}
.mus #vtiles{margin:8px 0 8px}
.mbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.navblk{margin-top:16px}
.qcard{background:var(--card);border-radius:22px;padding:12px;margin:12px 0}.night .qcard{background:#161E3C}
.qh{font-size:.72rem;font-weight:900;color:var(--ink2);opacity:.8;margin:0 4px 8px;letter-spacing:.06em;text-transform:uppercase}
.lcard{display:none}.mview .lcard{display:block}
.lcard .mrange{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}.lcard .mrange>*{margin:0;min-height:42px;justify-content:center}
.lcard .mrange #mInfo{grid-column:1/3;text-align:center;min-height:0}.lcard .mrange #mInfo:empty{display:none}.lcard #mClr{grid-column:1/3;min-height:34px}
.ctrl{gap:6px}.ctrl .big,.ctrl .mid,.ctrl .sb{flex:none}.ctrl .big{width:80px;height:80px}.ctrl .mid{width:56px;height:56px}.ctrl .sb{width:46px;height:46px}.ctrl .nbw{min-width:0}
.lcard .mrange>button{background:#FFF4E2}.night .lcard .mrange>button{background:#1E2750}.sb{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:900;font-size:1.05rem;color:var(--ink2)}
.night .sb{background:#1A2244;color:#C9C0DA}.sb.on{background:#FFF1D6;color:#9a5b00}.night .sb.on{background:#3A3420;color:#F2C14E}
#awBtn:not(.on){opacity:.55}
.iv{display:flex;gap:2px;background:rgba(0,0,0,.06);border-radius:999px;padding:3px;margin-right:4px}.night .iv{background:#1E2750}
.iv button{width:38px;height:34px;display:grid;place-items:center;border-radius:999px;font-size:1.05rem;background:transparent}.iv button.on{background:var(--accent)}
#mbar{display:none}.mview #mbar{display:flex}.mview #tbar{display:none}
.mbar .pg{font-weight:900;color:var(--ink2);min-width:58px;text-align:center;font-size:.92rem}
.mbar .round.sm{width:36px;height:36px}
.zb{display:flex;gap:4px}
.zb button{background:var(--card);border-radius:999px;height:34px;padding:0 8px;font-weight:900;color:var(--ink2);font-size:.85rem;white-space:nowrap}
.card .zb button{background:#FAEEDA;height:30px}
.night .zb button,.night .card .zb button{background:#1A2244}
.mpk{background:var(--card);border-radius:999px;padding:7px 10px;font-weight:900;color:var(--ink2);display:flex;align-items:center;gap:5px;font-size:.82rem;white-space:nowrap}
.mpk .ck{width:20px;height:20px;border-radius:50%;border:3px solid #D3D1C7;color:transparent;display:grid;place-items:center;font-size:.7rem}
.mpk.on .ck{background:#1D9E75;border-color:#1D9E75;color:#fff}
.night .mpk{background:#1A2244}.night .mpk .ck{border-color:#4A5486}.night .mpk.on .ck{background:#7FD6C2;border-color:#7FD6C2;color:#0B1024}
.mpage{background:#FFFDF6;border-radius:0;border:1.5px solid var(--accent);box-shadow:0 2px 10px rgba(0,0,0,.08);padding:14px 10px;direction:rtl;font-family:"Scheherazade New",serif;line-height:1.5;overflow:hidden;touch-action:pan-y;aspect-ratio:1/1.58;display:flex;flex-direction:column;justify-content:space-between}
.night .mpage{background:#121A36}
.mpage.txt{direction:ltr;display:block;aspect-ratio:auto;min-height:55vh;font-family:"Gentium Book Plus",Georgia,serif;font-size:calc(var(--fs)*.5)!important;line-height:1.75;text-align:left;padding:16px 14px}
.mpage.txt .mh{display:flex;font-size:.85em;margin:.4em 0 .5em;padding:.15em 0}
.mpage.txt .mtb{text-align:center;margin:.2em 0 .5em;font-style:italic}
.mpage.txt .mtp{margin:.15em 0 .6em}
.mpage.txt .mw{border-radius:6px;padding:0 .03em}
.mpage.txt.trl .mw{white-space:nowrap}
.mpage.txt .mvn{font-size:.8em;padding:0 .1em}
.mpage.few{justify-content:center;gap:1.1em}
.ml{display:flex;justify-content:space-between;white-space:nowrap}
.ml.c{justify-content:center;gap:.3em}
.mh{justify-content:center;font-size:.85em;border:1.5px solid var(--accent);border-radius:0;margin:.2em 0;color:var(--ink2);background:rgba(216,90,48,.06)}
.night .mh{background:rgba(242,193,78,.08)}
.mb{justify-content:center;gap:.3em}
.mw{border-radius:6px;padding:0 .04em;cursor:pointer;transition:background .12s,color .12s,opacity .2s}
.mw.dim,.mvn.dim{opacity:.28}
.mw.ot{opacity:.28}
.mw.on{background:var(--accent);color:#fff}
.night .mw.on{color:#0B1024}
.mvn{color:var(--accent-d);cursor:pointer;border-radius:50%;padding:0 .05em}
.mvn.kn{background:#1D9E75;color:#fff;border-radius:999px;padding:0 .2em}
.night .mvn.kn{background:#7FD6C2;color:#0B1024}
.mpage.zoom{font-size:calc(var(--fs)*.78)!important;line-height:2.1;text-align:justify;aspect-ratio:auto;display:block}
.mpage.zoom .ml{display:inline;white-space:normal;width:auto!important;margin:0!important}
.mpage.zoom .mh,.mpage.zoom .mb{display:flex}
.mpage.zoom .ml.tx::after{content:" "}
.mrange{display:flex;gap:6px;justify-content:center;align-items:center;margin:10px 0 4px;flex-wrap:wrap}
.mrange button{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:900;color:var(--ink2)}
.mrange button.on{background:var(--accent);color:#fff}
.night .mrange button{background:#1A2244}.night .mrange button.on{color:#0B1024;background:var(--accent)}
.mrange .info{font-weight:800;color:var(--ink2);font-size:.9rem}
.hide .mpage .mw,.hide .mpage .mvn{filter:blur(8px)}
.hide .mpage.peek .mw,.hide .mpage.peek .mvn{filter:none}
.mpage.still .mw.ot,.mpage.still .mvn.ot{opacity:1}
.mw.sel{background:rgba(216,90,48,.13)}
.night .mw.sel{background:rgba(242,193,78,.16)}
.awb{background:var(--card);border-radius:999px;padding:8px 16px;font-weight:900;color:var(--ink2);font-size:.9rem}
.awb.on{background:#FFF1D6;color:#9a5b00}
.night .awb{background:#1A2244}.night .awb.on{background:#3A3420;color:#F2C14E}

īn"],"d":[[0,"Eure Frauen sind euch ein Saatfeld. So kommt zu eurem Saatfeld, wie ihr wollt, und schickt für euch selbst Gutes voraus. Fürchtet Allah und wisst, dass ihr Ihm begegnen werdet. Und verkünde den Gläubigen die frohe Botschaft."]]},{"w":["وَلَا","تَجۡعَلُواْ","ٱللَّهَ","عُرۡضَةࣰ","لِّأَيۡمَٰنِكُمۡ","أَن","تَبَرُّواْ","وَتَتَّقُواْ","وَتُصۡلِحُواْ","بَيۡنَ","ٱلنَّاسِۚ","وَٱللَّهُ","سَمِيعٌ","عَلِيمࣱ"],"t":["wa lā","taǧʿalū","llāha","ʿurḍatan","li aymānikum","an","tabarrū","wa tattaqū","wa tuṣliḥū","bayna","n-nāsi","wa llāhu","samīʿun","ʿalīm"],"d":[[0,"Macht Allah nicht durch eure Eide zu einem Hindernis, Gutes zu tun, gottesfürchtig zu sein und zwischen den Menschen Frieden zu stiften. Allah hört und weiß alles."]]},{"w":["لَّا","يُؤَاخِذُكُمُ","ٱللَّهُ","بِٱللَّغۡوِ","فِيٓ","أَيۡمَٰنِكُمۡ","وَلَٰكِن","يُؤَاخِذُكُم","بِمَا","كَسَبَتۡ","قُلُوبُكُمۡۗ","وَٱللَّهُ","غَفُورٌ","حَلِيمࣱ"],"t":["lā","yuʾāḫiḏukumu","llāhu","bi l-laġwi","fī","aymānikum","wa lākin","yuʾāḫiḏukum","bi mā","kasabat","qulūbukum","wa llāhu","ġafūrun","ḥalīm"],"d":[[0,"Allah belangt euch nicht wegen unbedachter Worte in euren Eiden, aber Er belangt euch für das, was eure Herzen erworben haben. Allah ist vergebend und nachsichtig."]]},{"w":["لِّلَّذِينَ","يُؤۡلُونَ","مِن","نِّسَآئِهِمۡ","تَرَبُّصُ","أَرۡبَعَةِ","أَشۡهُرࣲۖ","فَإِن","فَآءُو","فَإِنَّ","ٱللَّهَ","غَفُورࣱ","رَّحِيمࣱ"],"t":["li llaḏīna","yuʾlūna","min","nisāʾihim","tarabbuṣu","arbaʿati","ašhurin","fa in","fāʾū","fa inna","llāha","ġafūrun","raḥīm"],"d":[[0,"Für diejenigen, die schwören, sich von ihren Frauen fernzuhalten, gilt eine Wartezeit von vier Monaten. Wenn sie dann zurückkehren, so ist Allah vergebend und barmherzig."]]},{"w":["وَإِنۡ","عَزَمُواْ","ٱلطَّلَٰقَ","فَإِنَّ","ٱللَّهَ","سَمِيعٌ","عَلِيمࣱ"],"t":["wa in","ʿazamū","ṭ-ṭalāqa","fa inna","llāha","samīʿun","ʿalīm"],"d":[[0,"Wenn sie sich aber zur Scheidung entschließen, so hört und weiß Allah alles."]]},{"w":["وَٱلۡمُطَلَّقَٰتُ","يَتَرَبَّصۡنَ","بِأَنفُسِهِنَّ","ثَ ch vor einem Tag, an dem ihr zu Allah zurückgebracht werdet. Dann wird jeder Seele voll vergolten, was sie erworben hat, und ihnen wird kein Unrecht getan."]]},{"w":["يَـٰٓأَيُّهَا","ٱلَّذِينَ","ءَامَنُوٓاْ","إِذَا","تَدَايَنتُم","بِدَيۡنٍ","إِلَىٰٓ","أَجَلࣲ","مُّسَمࣰّى","فَٱكۡتُبُوهُۚ","وَلۡيَكۡتُب","بَّيۡنَكُمۡ","كَاتِبُۢ","بِٱلۡعَدۡلِۚ","وَلَا","يَأۡبَ","كَاتِبٌ","أَن","يَكۡتُبَ","كَمَا","عَلَّمَهُ","ٱللَّهُۚ","فَلۡيَكۡتُبۡ","وَلۡيُمۡلِلِ","ٱلَّذِي","عَلَيۡهِ","ٱلۡحَقُّ","وَلۡيَتَّقِ","ٱللَّهَ","رَبَّهُۥ","وَلَا","يَبۡخَسۡ","مِنۡهُ","شَيۡـࣰٔاۚ","فَإِن","كَانَ","ٱلَّذِي","عَلَيۡهِ","ٱلۡحَقُّ","سَفِيهًا","أَوۡ","ضَعِيفًا","أَوۡ","لَا","يَسۡتَطِيعُ","أَن","يُمِلَّ","هُوَ","فَلۡيُمۡلِلۡ","وَلِيُّهُۥ","بِٱلۡعَدۡلِۚ","وَٱسۡتَشۡهِدُواْ","شَهِيدَيۡنِ","مِن","رِّجَالِكُمۡۖ","فَإِن","لَّمۡ","يَكُونَا","رَجُلَيۡنِ","فَرَجُلࣱ","وَٱمۡرَأَتَانِ","مِمَّن","تَرۡضَوۡنَ","مِنَ","ٱلشُّهَدَآءِ","أَن","تَضِلَّ","إِحۡدَىٰهُمَا","فَتُذَكِّرَ","إِحۡدَىٰهُمَا","ٱلۡأُخۡرَىٰۚ","وَلَا","يَأۡبَ","ٱلشُّهَدَآءُ","إِذَا","مَا","دُعُواْۚ","وَلَا","تَسۡـَٔمُوٓاْ","أَن","تَكۡتُبُوهُ","صَغِيرًا","أَوۡ","كَبِيرًا","إِلَىٰٓ","أَجَلِهِۦۚ","ذَٰلِكُمۡ","أَقۡسَطُ","عِندَ","ٱللَّهِ","وَأَقۡوَمُ","لِلشَّهَٰدَةِ","وَأَدۡنَىٰٓ","أَلَّا","تَرۡتَابُوٓاْ","إِلَّآ","أَن","تَكُونَ","تِجَٰرَةً","حَاضِرَةࣰ","تُدِيرُونَهَا","بَيۡنَكُمۡ","فَلَيۡسَ","عَلَيۡكُمۡ","جُنَاحٌ","أَلَّا","تَكۡتُبُوهَاۗ","وَأَشۡهِدُوٓاْ","إِذَا","تَبَايَعۡتُمۡۚ","وَلَا","يُضَآرَّ","كَاتِبࣱ","وَلَا","شَهِيدࣱۚ","وَإِن","تَفۡعَلُواْ","فَإِنَّهُۥ","فُسُوقُۢ","بِكُمۡۗ","وَٱتَّقُواْ","ٱللَّهَۖ","وَيُعَلِّمُكُمُ","ٱللَّهُۗ","وَٱللَّهُ","بِكُلِّ","شَيۡءٍ","عَلِيمࣱ"],"t":["yā ayyuhā","llaḏīna","āmanū","iḏā","tadāyantum","bi daynin","ilā","aǧalin","musamman","fa ktubūhu","wa l-yaktub","baynakum","kātibun","bi l-ʿadli","wa lā","yaʾba","kātibun","an","yaktuba","ka mā","ʿallamahu","llāhu","fa l-yaktub","wa l-yumlili","llaḏī","ʿalayhi","l-ḥaqqu","wa l-yattaqi","llāha","rabbahū","wa lā","yabḫas","minhu","šayʾan","fa in","kāna","llaḏī","ʿalayhi","l-ḥaqqu
